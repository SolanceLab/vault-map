<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" width="1020" height="530" role="img" aria-labelledby="t d">
  <title id="t">How vault-map works</title>
  <desc id="d">Without vault-map your AI opens note after note (crossed out). vault-map maps your vault once on your computer: every note's title, headings and tags, and the links between notes. Asked where you wrote about the backup plan, it points to the note, the section and the passage that answers, with the notes linked around it, and it can trace the path from one note to another.</desc>
  <style>
    .bg{fill:none}
    .frame{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:6 5}
    .title{font:600 17px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .label{font:500 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .small{font:400 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#59636e}
    .verb{font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .arrow{stroke:#59636e;stroke-width:2;fill:none}
    .head{fill:#59636e}
    .line{stroke:#afb8c1;stroke-width:3;stroke-linecap:round}
    .plank{stroke:#59636e;stroke-width:3;stroke-linecap:round}
    .note{fill:#dafbe1;stroke:#1a7f37}
    .chat{fill:#ddf4ff;stroke:#0969da}
    .mem{fill:#fbefff;stroke:#8250df}
    .vault{fill:#fff1e5;stroke:#bc4c00}
    .q{fill:#ffffff;stroke:#1f2328}
    .old{stroke:#afb8c1;stroke-width:2;stroke-dasharray:5 5;fill:none}.oldhead{fill:#afb8c1}.x{stroke:#cf222e}
    .note.pick{fill:#1a7f37}.chat.pick{fill:#0969da}.mem.pick{fill:#8250df}
    .ante{fill:#1f2328;stroke:#1f2328}
    .antetext{font:600 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ffffff}
    .card{fill:#ffffff;stroke:#8c959f}
    @media (prefers-color-scheme: dark){
      .frame{fill:#161b22;stroke:#6e7681}
      .title,.label,.verb{fill:#e6edf3}
      .small{fill:#9198a1}
      .arrow{stroke:#9198a1}.head{fill:#9198a1}
      .line{stroke:#484f58}
      .plank{stroke:#9198a1}
      .note{fill:#0f2a17;stroke:#3fb950}
      .chat{fill:#0c2440;stroke:#4493f8}
      .mem{fill:#2a1640;stroke:#ab7df8}
      .vault{fill:#3a1d0a;stroke:#f0883e}
      .q{fill:#0d1117;stroke:#e6edf3}
      .old{stroke:#484f58}.oldhead{fill:#484f58}.x{stroke:#f85149}
      .note.pick{fill:#3fb950}.chat.pick{fill:#4493f8}.mem.pick{fill:#ab7df8}
      .ante{fill:#e6edf3;stroke:#e6edf3}
      .antetext{fill:#0d1117}
      .card{fill:#0d1117;stroke:#6e7681}
    }
    .hl{fill:#fff8c5;stroke:#9a6700}.hltext{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#59636e}
    .tag{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .tdec{fill:#8250df}.ttask{fill:#0969da}.tship{fill:#1a7f37}
    .thread{stroke:#9a6700;stroke-width:2.5;fill:none}.drawer{fill:none;stroke:#ffffff;stroke-width:1.5}
    @media (prefers-color-scheme: dark){
      .hl{fill:#2e2a0e;stroke:#d29922}.hltext{fill:#e6edf3}.mono{fill:#9198a1}
      .tdec{fill:#ab7df8}.ttask{fill:#4493f8}.tship{fill:#3fb950}.thread{stroke:#d29922}.drawer{stroke:#0d1117}
    }
    .wl{stroke:#8c959f;stroke-width:1.4;fill:none}.wlpick{stroke:#bc4c00;stroke-width:2.2;fill:none}
    .chip{font:600 10px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#59636e}
    .ncard{fill:#ffffff;stroke:#8c959f}.npick{fill:#fff1e5;stroke:#bc4c00}
    @media (prefers-color-scheme: dark){ .wl{stroke:#6e7681}.wlpick{stroke:#f0883e}.chip{fill:#9198a1}.ncard{fill:#0d1117;stroke:#6e7681}.npick{fill:#3a1d0a;stroke:#f0883e} }
  </style>
<rect class="q" x="410" y="20" width="200" height="46" rx="8" stroke-width="1.5"/><text class="verb" x="510" y="49" text-anchor="middle">Your AI</text>
<path class="old" d="M410 43 H195 V128"/><polygon class="oldhead" points="195,138 189,126 201,126"/>
<line class="x" x1="292" y1="30" x2="316" y2="56" stroke-width="3"/><line class="x" x1="316" y1="30" x2="292" y2="56" stroke-width="3"/>
<text class="small" x="304" y="80" text-anchor="middle">no more opening note after note</text>
<path class="arrow" d="M510 66 V218"/><polygon class="head" points="510,228 504,218 516,218"/><text class="small" x="522" y="112">where did we write about the backup plan?</text>
<rect class="frame" x="20" y="140" width="350" height="360" rx="14"/><text class="title" x="40" y="172">Your vault</text>
<line class="wlpick" x1="191" y1="282" x2="94" y2="212"/>
<line class="wlpick" x1="191" y1="282" x2="288" y2="212"/>
<line class="wl" x1="288" y1="212" x2="94" y2="212"/>
<line class="wl" x1="191" y1="282" x2="94" y2="352"/>
<line class="wl" x1="94" y1="352" x2="191" y2="422"/>
<line class="wl" x1="288" y1="352" x2="191" y2="422"/>
<line class="wl" x1="288" y1="352" x2="288" y2="212"/>
<rect class="ncard" x="38" y="192" width="112" height="40" rx="7" stroke-width="1.4"/>
<text class="mono" x="48" y="209" style="font-size:10.5px">servers.md</text><text class="chip" x="48" y="224">#ops · ## headings</text>
<rect class="ncard" x="232" y="192" width="112" height="40" rx="7" stroke-width="1.4"/>
<text class="mono" x="242" y="209" style="font-size:10.5px">incident.md</text><text class="chip" x="242" y="224">#ops · ## headings</text>
<rect class="npick" x="135" y="262" width="112" height="40" rx="7" stroke-width="1.4"/>
<text class="mono" x="145" y="279" style="font-size:10.5px">backups.md</text><text class="chip" x="145" y="294">#ops · ## headings</text>
<rect class="ncard" x="38" y="332" width="112" height="40" rx="7" stroke-width="1.4"/>
<text class="mono" x="48" y="349" style="font-size:10.5px">budget.md</text><text class="chip" x="48" y="364">#money · ## headings</text>
<rect class="ncard" x="232" y="332" width="112" height="40" rx="7" stroke-width="1.4"/>
<text class="mono" x="242" y="349" style="font-size:10.5px">ideas.md</text><text class="chip" x="242" y="364">#later · ## headings</text>
<rect class="ncard" x="135" y="402" width="112" height="40" rx="7" stroke-width="1.4"/>
<text class="mono" x="145" y="419" style="font-size:10.5px">travel.md</text><text class="chip" x="145" y="434">#trips · ## headings</text>
<text class="small" x="40" y="486">notes, headings, tags and the [[links]] between them</text>
<path class="arrow" d="M370 268 H428"/><polygon class="head" points="438,268 428,262 428,274"/><text class="small" x="405" y="254" text-anchor="middle">maps once</text>
<rect class="ante" x="440" y="228" width="140" height="84" rx="10"/><text class="antetext" x="510" y="256" text-anchor="middle">vault-map</text>
<text class="antetext" x="510" y="279" text-anchor="middle" style="font-weight:400;font-size:12px">titles · headings</text><text class="antetext" x="510" y="295" text-anchor="middle" style="font-weight:400;font-size:12px">tags · links</text>
<text class="small" x="510" y="336" text-anchor="middle">on your computer</text><text class="small" x="510" y="352" text-anchor="middle">no AI inside</text>
<path class="arrow" d="M580 268 H638"/><polygon class="head" points="648,268 638,262 638,274"/><text class="small" x="615" y="254" text-anchor="middle">points</text>
<rect class="frame" x="650" y="140" width="350" height="360" rx="14"/><text class="title" x="670" y="172">What your AI reads</text>
<rect class="card" x="670" y="190" width="314" height="38" rx="8" stroke-width="1.5"/><text class="mono" x="686" y="214">notes/backups.md</text>
<rect class="card" x="686" y="236" width="298" height="32" rx="8" stroke-width="1.5"/><text class="mono" x="700" y="257">## Rotation</text>
<rect class="hl" x="702" y="276" width="282" height="56" rx="8" stroke-width="1.5"/>
<text class="hltext" x="714" y="298" style="font-size:11.5px">…keep three copies: one here, one</text>
<text class="hltext" x="714" y="316" style="font-size:11.5px">on the server, one off-site…</text>
<text class="small" x="670" y="360">linked around it:</text>
<rect class="ncard" x="670" y="370" width="140" height="30" rx="7" stroke-width="1.4"/><text class="mono" x="680" y="389" style="font-size:10.5px">servers.md</text>
<rect class="ncard" x="820" y="370" width="140" height="30" rx="7" stroke-width="1.4"/><text class="mono" x="830" y="389" style="font-size:10.5px">incident.md</text>
<text class="small" x="670" y="428">and the path from one note to another:</text><text class="mono" x="670" y="446" style="font-size:10.5px">budget.md → backups.md → servers.md</text>
<path class="arrow" d="M825 140 V43 H622"/><polygon class="head" points="612,43 622,37 622,49"/><text class="small" x="720" y="34" text-anchor="middle">reads only this</text>
<text class="small" x="510" y="514" text-anchor="middle">one Python file · standard library only · nothing leaves your computer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" width="1020" height="490" role="img" aria-labelledby="t d">
  <title id="t">How vault-map works</title>
  <desc id="d">Without vault-map your AI opens every note (crossed out). vault-map reads your vault once and keeps a catalogue of notes, sections and passages on your computer. Your AI asks where you wrote about something; vault-map points to one note, one section and the passage that answers, and your AI reads only that.</desc>

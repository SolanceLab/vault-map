    .line{stroke:#afb8c1;stroke-width:3;stroke-linecap:round}
    .plank{stroke:#59636e;stroke-width:3;stroke-linecap:round}
    .note{fill:#dafbe1;stroke:#1a7f37}
    .chat{fill:#ddf4ff;stroke:#0969da}

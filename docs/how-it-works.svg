    .ante{fill:#1f2328;stroke:#1f2328}
    .antetext{font:600 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ffffff}
    .card{fill:#ffffff;stroke:#8c959f}
    @media (prefers-color-scheme: dark){
      .frame{fill:#161b22;stroke:#6e7681}
      .title,.label,.verb{fill:#e6edf3}
      .small{fill:#9198a1}
      .arrow{stroke:#9198a1}.head{fill:#9198a1}
      .line{stroke:#484f58}
      .plank{stroke:#9198a1}
      .note{fill:#0f2a17;stroke:#3fb950}
      .chat{fill:#0c2440;stroke:#4493f8}
      .mem{fill:#2a1640;stroke:#ab7df8}
      .vault{fill:#3a1d0a;stroke:#f0883e}
      .q{fill:#0d1117;stroke:#e6edf3}
      .old{stroke:#484f58}.oldhead{fill:#484f58}.x{stroke:#f85149}
      .note.pick{fill:#3fb950}.chat.pick{fill:#4493f8}.mem.pick{fill:#ab7df8}
      .ante{fill:#e6edf3;stroke:#e6edf3}
      .antetext{fill:#0d1117}
      .card{fill:#0d1117;stroke:#6e7681}
    }
    .hl{fill:#fff8c5;stroke:#9a6700}.hltext{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#59636e}
    .tag{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .tdec{fill:#8250df}.ttask{fill:#0969da}.tship{fill:#1a7f37}
    .thread{stroke:#9a6700;stroke-width:2.5;fill:none}.drawer{fill:none;stroke:#ffffff;stroke-width:1.5}
